<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FNaF Lite - Security Office</title>
<style>
:root{color-scheme:dark;--bg:#050606;--fg:#eee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#050606;--fg:#eee}}
:root[data-theme=dark]{--bg:#050606;--fg:#eee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Courier New',monospace}
#game{width:min(100%,1000px);margin:auto;position:relative;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:auto}
#hud{position:absolute;top:8px;right:12px;text-align:right;text-shadow:2px 2px #000;pointer-events:none;z-index:30;font-size:13px}
#clock{font-size:clamp(18px,4vw,32px);font-weight:bold}
#notice{position:absolute;left:3%;bottom:17%;max-width:55%;font-size:clamp(10px,1.7vw,14px);text-shadow:2px 2px #000;pointer-events:none;z-index:30}
#pw{position:absolute;left:3%;bottom:8px;width:40%;font-size:clamp(10px,1.8vw,16px);text-shadow:2px 2px #000;pointer-events:none;z-index:30}
#bar{display:flex;gap:3px;height:clamp(12px,2.4vw,22px);border:2px solid #aaa;padding:2px;margin-top:3px}
.seg{flex:1;background:#333}.seg.on{background:#20c737}.seg.on:nth-child(3){background:#e0d522}.seg.on:nth-child(4){background:#ffb21c}.seg.on:nth-child(5){background:#ed2929}
button{font:bold 13px 'Courier New',monospace;color:#fff;background:#171c1a;border:2px solid #858d88;padding:10px;cursor:pointer}
button:active,button.on{background:#d4dbd3;color:#101010}
#ctl{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:12px;background:#101312}
#mon{display:none;position:absolute;inset:0;z-index:10}
#mon::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px,transparent 5px 7px)}
#cn{position:absolute;left:12px;top:8px;font-size:clamp(14px,3.6vw,36px);font-weight:bold;text-shadow:2px 2px #000;pointer-events:none}
#cn small{display:block;font-size:.45em;color:#ccc}#cn small::after{content:" ● REC";color:#e33;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#map{position:absolute;right:2%;bottom:3%;width:min(34%,320px);aspect-ratio:1;z-index:12;background:rgba(0,0,0,.4)}
#map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#map button{position:absolute;width:13%;height:10.5%;padding:0;font-size:clamp(6px,1.5vw,12px);line-height:1.1;border:2px solid #ddd;background:#4a4a4a;color:#ddd}
#map button.on{background:#8db600;color:#111}
#map b{position:absolute;left:0;top:-1.5em;color:#ff6a55;font-size:1.3em;text-shadow:1px 1px #000;white-space:nowrap}
#you{position:absolute;left:47%;top:83%;width:10%;height:15%;border:2px solid #ddd;font-size:clamp(6px,1.3vw,11px);text-align:center;line-height:1.2;padding-top:2px}
#you span{display:block;color:#ff6a55;font-weight:bold}
#ov{display:none;position:absolute;inset:0;background:#000;z-index:40;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;gap:12px}
#ov h1{font-size:clamp(24px,5vw,40px);margin:0}#ov p{margin:0;max-width:34em;font-size:clamp(11px,2vw,15px);line-height:1.5}
html,body{height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:#000}
#game{width:min(100vw,177.78vh);max-width:none;aspect-ratio:16/9;touch-action:none;user-select:none;-webkit-user-select:none}
#ctl{position:absolute;top:1.5%;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:35;padding:0;background:none}
#ctl button,#game>button{padding:6px 10px;font-size:clamp(9px,1.7vw,16px);background:rgba(20,25,22,.88)}
#game>button{position:absolute;z-index:35}
#l{left:1.5%;top:34%}#ll{left:1.5%;top:50%}#r{right:1.5%;top:34%}#lr{right:1.5%;top:50%}
#cam{left:50%;bottom:2%;transform:translateX(-50%);width:30%}
#game.m #ll,#game.m #lr{display:none}
#pw{width:26%;font-size:clamp(10px,1.8vw,24px)}#notice{font-size:clamp(10px,1.7vw,24px)}#cn{font-size:clamp(14px,3.6vw,56px)}#clock{font-size:clamp(18px,4vw,56px)}
#map{width:min(26%,480px)}
#rot{display:none;position:fixed;inset:0;z-index:100;background:#000;color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px}
@media(orientation:portrait){#rot{display:flex}}
